<!doctype html>
<html lang="is">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0f6b45" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icon-192.svg" />
  <title>Golfskor</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <div>
        <p class="eyebrow">18 holur</p>
        <h1>Golfskor</h1>
      </div>
      <button id="resetBtn" class="ghost danger" type="button">Nýr hringur</button>
    </header>

    <section id="setupView" class="panel">
      <h2>Setja upp hring</h2>
      <label>
        Nafn vallar
        <input id="courseName" type="text" placeholder="T.d. Urriðavöllur" maxlength="50" />
      </label>

      <label>
        Fjöldi golfara
        <select id="playerCount">
          <option value="1">1 golfari</option>
          <option value="2" selected>2 golfarar</option>
          <option value="3">3 golfarar</option>
          <option value="4">4 golfarar</option>
        </select>
      </label>

      <div id="playerInputs" class="player-inputs"></div>
      <button id="startBtn" class="primary" type="button">Hefja hring</button>
    </section>

    <section id="gameView" class="hidden">
      <section class="hero-card">
        <div>
          <p id="courseLabel" class="eyebrow">Golfhringur</p>
          <h2 id="holeTitle">Hola 1 af 18</h2>
        </div>
        <div class="hole-pill" id="holePill">1</div>
      </section>

      <section class="panel">
        <h3>Skrá högg</h3>
        <div id="scoreInputs" class="score-list"></div>
        <div class="nav-row">
          <button id="prevBtn" class="secondary" type="button">Fyrri hola</button>
          <button id="nextBtn" class="primary" type="button">Vista og næsta</button>
        </div>
      </section>

      <section class="panel">
        <div class="section-heading">
          <h3>Staðan</h3>
          <span id="completedLabel" class="muted">0 holur skráðar</span>
        </div>
        <div id="leaderSummary" class="summary-grid"></div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr><th>Golfari</th><th>Högg</th><th>Unnar</th></tr>
            </thead>
            <tbody id="leaderboard"></tbody>
          </table>
        </div>
      </section>

      <section id="finalView" class="panel hidden">
        <h3>Lokaniðurstaða</h3>
        <div id="finalSummary" class="final-summary"></div>
      </section>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
